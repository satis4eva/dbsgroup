name: Build blog

# Rebuilds blog pages, homepage news and social links whenever posts or settings change
# (for example after editing in the Pages CMS portal). Hostinger then deploys the result.
on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "scripts/build_blog.py"
      - "css/**"
      - "js/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown pyyaml
      - run: python3 scripts/build_blog.py
      - name: Commit built pages
        run: |
          git config user.name "dbsgroup-bot"
          git config user.email "hello@dbsgroup.io"
          git add -A
          git diff --cached --quiet || git commit -m "Rebuild blog"
          git push
